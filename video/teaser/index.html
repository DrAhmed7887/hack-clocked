<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #070B14; }
      #root { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(640px 520px at 78% 30%, #E8A33D2E, transparent 70%),
          radial-gradient(720px 620px at 12% 82%, rgba(46,140,170,0.22), transparent 70%),
          linear-gradient(180deg, #0B1322 0%, #070B14 100%); }
      #grid { position: absolute; inset: 0; z-index: 0; opacity: 0.35;
        background-image: linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
        background-size: 54px 54px; }
    </style>
  </head>
  <body>
    <!-- Generated by build.mjs from teaser.json. Edit those, then run: node build.mjs -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1080">
      <div id="ground" data-layout-ignore></div>
      <div id="grid" data-layout-ignore></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1080" style="z-index:2"></div>
      <div id="records" data-composition-id="records" data-composition-src="compositions/records.html" data-start="3" data-duration="4.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1080" style="z-index:2"></div>
      <div id="conflict" data-composition-id="conflict" data-composition-src="compositions/conflict.html" data-start="7.8" data-duration="4.4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1080" style="z-index:2"></div>
      <div id="verify" data-composition-id="verify" data-composition-src="compositions/verify.html" data-start="12.2" data-duration="5.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1080" style="z-index:2"></div>
      <div id="meds" data-composition-id="meds" data-composition-src="compositions/meds.html" data-start="18" data-duration="4.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1080" style="z-index:2"></div>
      <div id="results" data-composition-id="results" data-composition-src="compositions/results.html" data-start="22.8" data-duration="4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1080" style="z-index:2"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="26.8" data-duration="3.2" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1080" style="z-index:2"></div>
      <div id="frame" data-composition-id="frame" data-composition-src="compositions/frame.html" data-start="0" data-duration="30" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1080" style="z-index:5"></div>
      <audio id="music" class="clip" src="assets/audio/music.mp3" data-start="0" data-duration="30" data-media-start="120" data-volume="1" data-fade-in="0.4" data-fade-out="1.6" data-track-index="20"></audio>
      <audio id="sfx-cap-records" class="clip" src="assets/audio/pop.mp3" data-start="3.25" data-duration="0.5" data-volume="0.25" data-track-index="21"></audio>
      <audio id="sfx-click-records-0" class="clip" src="assets/audio/tick.mp3" data-start="4.5" data-duration="0.5" data-volume="0.6" data-track-index="22"></audio>
      <audio id="sfx-cap-conflict" class="clip" src="assets/audio/pop.mp3" data-start="8.05" data-duration="0.5" data-volume="0.25" data-track-index="21"></audio>
      <audio id="sfx-cap-verify" class="clip" src="assets/audio/pop.mp3" data-start="12.45" data-duration="0.5" data-volume="0.25" data-track-index="22"></audio>
      <audio id="sfx-click-verify-0" class="clip" src="assets/audio/tick.mp3" data-start="15.3" data-duration="0.5" data-volume="0.6" data-track-index="21"></audio>
      <audio id="sfx-cap-meds" class="clip" src="assets/audio/pop.mp3" data-start="18.25" data-duration="0.5" data-volume="0.25" data-track-index="22"></audio>
      <audio id="sfx-click-meds-0" class="clip" src="assets/audio/tick.mp3" data-start="19.9" data-duration="0.5" data-volume="0.6" data-track-index="21"></audio>
      <audio id="sfx-cap-results" class="clip" src="assets/audio/pop.mp3" data-start="23.05" data-duration="0.5" data-volume="0.25" data-track-index="22"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
